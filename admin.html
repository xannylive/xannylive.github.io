<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>XANNYLIVE | Admin Panel</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        body {
            min-height: 100vh;
        }

        .admin-container {

            max-width: 900px;

            margin: auto;

            padding:
                120px
                25px
                60px;

        }

        .admin-header {
            margin-bottom: 40px;
        }

        .admin-header span {

            color: var(--accent);

            font-size: 12px;

            font-weight: bold;

            letter-spacing: 2px;

        }

        .admin-header h1 {

            font-size: 48px;

            margin-top: 10px;

        }

        .admin-header p {

            color: var(--muted);

        }

        .panel {

            background: #101010;

            border: 1px solid #242424;

            border-radius: 18px;

            padding: 30px;

            margin-bottom: 20px;

        }

        .panel h2 {

            font-size: 20px;

            margin-bottom: 25px;

        }

        .field {

            margin-bottom: 20px;

        }

        .field label {

            display: block;

            color: #aaa;

            font-size: 12px;

            margin-bottom: 8px;

        }

        .field input {

            width: 100%;

            padding: 14px;

            background: #080808;

            border: 1px solid #292929;

            color: white;

            border-radius: 8px;

            outline: none;

        }

        .field input:focus {

            border-color:
                var(--accent);

        }

        .save-btn {

            border: none;

            cursor: pointer;

            background:
                var(--accent);

            color: white;

            padding:
                14px 24px;

            border-radius: 8px;

            font-weight: bold;

        }

        .back-btn {

            display: inline-block;

            margin-top: 20px;

            color: #aaa;

            font-size: 13px;

        }

        #message {

            margin-top: 15px;

            color: var(--green);

            font-size: 13px;

        }

    </style>

</head>


<body>


<div class="admin-container">


    <div class="admin-header">

        <span>
            XANNYLIVE CONTROL PANEL
        </span>

        <h1>
            Admin Panel
        </h1>

        <p>
            Sosyal medya ve yayın
            bağlantılarını düzenle.
        </p>

    </div>


    <div class="panel">

        <h2>
            Yayın & Sosyal Medya
        </h2>


        <div class="field">

            <label>
                Kick
            </label>

            <input
                type="url"
                id="kick"
                placeholder="https://kick.com/xannylive"
            >

        </div>


        <div class="field">

            <label>
                Instagram
            </label>

            <input
                type="url"
                id="instagram"
                placeholder="Instagram bağlantısı"
            >

        </div>


        <div class="field">

            <label>
                YouTube
            </label>

            <input
                type="url"
                id="youtube"
                placeholder="YouTube bağlantısı"
            >

        </div>


        <div class="field">

            <label>
                TikTok
            </label>

            <input
                type="url"
                id="tiktok"
                placeholder="TikTok bağlantısı"
            >

        </div>


        <div class="field">

            <label>
                Discord
            </label>

            <input
                type="url"
                id="discord"
                placeholder="Discord bağlantısı"
            >

        </div>


        <button
            class="save-btn"
            onclick="saveSettings()"
        >
            Ayarları Kaydet
        </button>


        <p id="message"></p>

    </div>


    <a
        href="index.html"
        class="back-btn"
    >
        ← Siteye Dön
    </a>


</div>


<script>

const defaultData = {

    kick:
        "https://kick.com/xannylive",

    instagram: "",

    youtube: "",

    tiktok: "",

    discord: ""

};


function loadSettings() {

    const saved =
        JSON.parse(
            localStorage.getItem(
                "xannySettings"
            )
        )
        ||
        defaultData;


    document.getElementById("kick")
        .value =
        saved.kick || "";


    document.getElementById("instagram")
        .value =
        saved.instagram || "";


    document.getElementById("youtube")
        .value =
        saved.youtube || "";


    document.getElementById("tiktok")
        .value =
        saved.tiktok || "";


    document.getElementById("discord")
        .value =
        saved.discord || "";

}


function saveSettings() {

    const data = {

        kick:
            document.getElementById("kick")
                .value,

        instagram:
            document.getElementById("instagram")
                .value,

        youtube:
            document.getElementById("youtube")
                .value,

        tiktok:
            document.getElementById("tiktok")
                .value,

        discord:
            document.getElementById("discord")
                .value

    };


    localStorage.setItem(
        "xannySettings",
        JSON.stringify(data)
    );


    document.getElementById(
        "message"
    ).textContent =
        "Ayarlar kaydedildi ✓";

}


loadSettings();

</script>


</body>

</html>
