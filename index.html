<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xanny Store | Premium Oyunlar</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome (İkonlar için) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">XANNY<span>STORE</span></div>
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Oyun ara... (örn: Cyberpunk)">
        </div>
        <div class="nav-actions">
            <button class="cart-btn">
                <i class="fa-solid fa-cart-shopping"></i> 
                <span id="cartCount">0</span>
            </button>
        </div>
    </nav>

    <main>
        <div class="filters" id="filters">
            <button class="filter-btn active" data-filter="all">Tümü</button>
            <button class="filter-btn" data-filter="rpg">RPG</button>
            <button class="filter-btn" data-filter="fps">FPS</button>
            <button class="filter-btn" data-filter="action">Aksiyon</button>
        </div>

        <!-- Oyun kartları buraya JS ile basılacak -->
        <div class="games-grid" id="gamesGrid"></div>
    </main>

    <!-- Bildirimler (Toast) için kutu -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
